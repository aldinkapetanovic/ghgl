apiVersion: v1
kind: Namespace
metadata:
  name: ghgl
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ghgl-config
  namespace: ghgl
data:
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghgl-app
  namespace: ghgl
  labels:
    app: ghgl
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ghgl
  template:
    metadata:
      labels:
        app: ghgl
        version: v1
    spec:
      containers:
      - name: ghgl
        image: docker.io/username/ghgl:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 5000
          protocol: TCP
        env:
        - name: FLASK_ENV
          valueFrom:
            configMapKeyRef:
              name: ghgl-config
              key: FLASK_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ghgl-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ghgl-service
  namespace: ghgl
  labels:
    app: ghgl
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: ghgl
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ghgl-hpa
  namespace: ghgl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ghgl-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ghgl-network-policy
  namespace: ghgl
spec:
  podSelector:
    matchLabels:
      app: ghgl
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 5000
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
