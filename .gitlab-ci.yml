stages:
  - test
  - build
  - push

variables:
  REGISTRY_IMAGE: $CI_REGISTRY_IMAGE
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"

# Test job
test:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc
    - pip install --upgrade pip setuptools wheel
    - pip install -r requirements.txt
  script:
    - black --check app tests
    - isort --check-only app tests
    - flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
    - flake8 app tests --count --exit-zero --max-complexity=10
    - pytest tests/ -v --cov=app --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

# Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker tag $REGISTRY_IMAGE:$CI_COMMIT_SHA $REGISTRY_IMAGE:latest
    - docker push $REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker push $REGISTRY_IMAGE:latest
  only:
    - main
    - develop

# Push to GitHub Container Registry
push_github:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $GITHUB_USERNAME -p $GITHUB_TOKEN ghcr.io
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY_IMAGE:$CI_COMMIT_SHA ghcr.io/$GITHUB_REPO:$CI_COMMIT_SHA
    - docker tag $REGISTRY_IMAGE:$CI_COMMIT_SHA ghcr.io/$GITHUB_REPO:latest
    - docker push ghcr.io/$GITHUB_REPO:$CI_COMMIT_SHA
    - docker push ghcr.io/$GITHUB_REPO:latest
  only:
    - main
    - develop
  when: manual

# Tag release
tag_release:
  stage: push
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $REGISTRY_IMAGE:$CI_COMMIT_SHA
    - docker tag $REGISTRY_IMAGE:$CI_COMMIT_SHA $REGISTRY_IMAGE:$CI_COMMIT_TAG
    - docker push $REGISTRY_IMAGE:$CI_COMMIT_TAG
  only:
    - tags
