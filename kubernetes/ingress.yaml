apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ghgl-ingress
  namespace: ghgl
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
  - hosts:
    - ghgl.example.com
    secretName: ghgl-tls
  rules:
  - host: ghgl.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ghgl-service
            port:
              number: 80
